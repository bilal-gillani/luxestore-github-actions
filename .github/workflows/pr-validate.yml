name: Pull Request CI & Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - "ecommerce-backend/**"
      - "html/**"
      - "db/**"
      - "infra/**"
      - "scripts/**"

permissions:
  contents: read

jobs:
  validate-code-and-bicep:
    name: Lint & Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check Backend Syntax & Dependencies
        working-directory: ecommerce-backend
        run: |
          npm ci
          node -c server.js
          echo "✅ Backend syntax validated successfully."

      - name: Validate Bicep Templates
        run: |
          az bicep build --file infra/main.bicep
          echo "✅ Bicep templates compiled successfully without syntax errors."

  test-docker-builds:
    name: Test Container Builds (Dry Run)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./ecommerce-backend
          push: false
          tags: luxestore-backend:test

      - name: Build Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./html
          push: false
          tags: luxestore-frontend:test
