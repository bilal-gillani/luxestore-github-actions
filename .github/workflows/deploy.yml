name: Deploy LuxeStore to Azure

on:
  push:
    branches:
      - main
    paths:
      - 'ecommerce-backend/**'
      - 'html/**'
      - 'db/**'
      - 'infra/**'
      - 'scripts/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  # ============================================================================
  # 1. Validation & Pre-flight Checks
  # ============================================================================
  validate:
    name: Validate Code & Templates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify Backend Syntax & Dependencies
        working-directory: ecommerce-backend
        run: |
          npm ci
          node -c server.js
          echo "✅ Backend syntax validated successfully."

      - name: Validate Bicep Templates
        run: |
          az bicep build --file infra/main.bicep
          echo "✅ Bicep templates compiled without errors."

  # ============================================================================
  # 2. Infrastructure Provisioning via Bicep
  # ============================================================================
  provision-infra:
    name: Provision Azure Infrastructure
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      mysqlServerName: ${{ steps.deploy-bicep.outputs.mysqlServerName }}
      mysqlServerFqdn: ${{ steps.deploy-bicep.outputs.mysqlServerFqdn }}
      backendAppName: ${{ steps.deploy-bicep.outputs.backendAppName }}
      frontendAppName: ${{ steps.deploy-bicep.outputs.frontendAppName }}
      backendAppUrl: ${{ steps.deploy-bicep.outputs.backendAppUrl }}
      frontendAppUrl: ${{ steps.deploy-bicep.outputs.frontendAppUrl }}
      acrLoginServer: ${{ steps.deploy-bicep.outputs.acrLoginServer }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Bicep Stack
        id: deploy-bicep
        run: |
          echo "🚀 Deploying Bicep infrastructure to ${{ vars.AZURE_RESOURCE_GROUP }}..."
          DEPLOY_OUTPUT=$(az deployment group create \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --template-file infra/main.bicep \
            --parameters infra/main.bicepparam \
            --parameters \
              mysqlAdminPassword='${{ secrets.MYSQL_ADMIN_PASSWORD }}' \
              appDbPassword='${{ secrets.APP_DB_PASSWORD }}' \
              jwtSecret='${{ secrets.JWT_SECRET }}' \
            --query properties.outputs -o json)

          echo "mysqlServerName=$(echo "$DEPLOY_OUTPUT" | jq -r .mysqlServerName.value)" >> "$GITHUB_OUTPUT"
          echo "mysqlServerFqdn=$(echo "$DEPLOY_OUTPUT" | jq -r .mysqlServerFqdn.value)" >> "$GITHUB_OUTPUT"
          echo "backendAppName=$(echo "$DEPLOY_OUTPUT" | jq -r .backendAppName.value)" >> "$GITHUB_OUTPUT"
          echo "frontendAppName=$(echo "$DEPLOY_OUTPUT" | jq -r .frontendAppName.value)" >> "$GITHUB_OUTPUT"
          echo "backendAppUrl=$(echo "$DEPLOY_OUTPUT" | jq -r .backendAppUrl.value)" >> "$GITHUB_OUTPUT"
          echo "frontendAppUrl=$(echo "$DEPLOY_OUTPUT" | jq -r .frontendAppUrl.value)" >> "$GITHUB_OUTPUT"
          echo "acrLoginServer=$(echo "$DEPLOY_OUTPUT" | jq -r .acrLoginServer.value)" >> "$GITHUB_OUTPUT"

  # ============================================================================
  # 3. Database Schema & Seed Initialization
  # ============================================================================
  init-database:
    name: Initialize Database Schema
    needs: provision-infra
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install MySQL Client
        run: |
          sudo apt-get update -y
          sudo apt-get install -y default-mysql-client

      - name: Authorize Runner IP on MySQL Firewall
        id: firewall
        run: |
          RUNNER_IP=$(curl -s https://api.ipify.org)
          RULE_NAME="GitHubRunner-$GITHUB_RUN_ID"
          echo "rule_name=$RULE_NAME" >> "$GITHUB_OUTPUT"
          echo "Adding firewall rule $RULE_NAME for runner IP $RUNNER_IP..."
          az mysql flexible-server firewall-rule create \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ needs.provision-infra.outputs.mysqlServerName }}" \
            --rule-name "$RULE_NAME" \
            --start-ip-address "$RUNNER_IP" \
            --end-ip-address "$RUNNER_IP"

      - name: Run Database Initialization & Seed Script
        env:
          MYSQL_ADMIN_PASSWORD: ${{ secrets.MYSQL_ADMIN_PASSWORD }}
          APP_DB_PASSWORD: ${{ secrets.APP_DB_PASSWORD }}
          MYSQL_HOST: ${{ needs.provision-infra.outputs.mysqlServerFqdn }}
          MYSQL_ADMIN_USER: sqladmin
        run: |
          chmod +x scripts/init-db.sh
          bash scripts/init-db.sh

      - name: Remove Runner IP Firewall Rule
        if: always()
        run: |
          if [ -n "${{ steps.firewall.outputs.rule_name }}" ]; then
            echo "Removing temporary firewall rule ${{ steps.firewall.outputs.rule_name }}..."
            az mysql flexible-server firewall-rule delete \
              --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --name "${{ needs.provision-infra.outputs.mysqlServerName }}" \
              --rule-name "${{ steps.firewall.outputs.rule_name }}" \
              --yes || true
          fi

  # ============================================================================
  # 4. Container Build & Push to ACR
  # ============================================================================
  build-and-push:
    name: Build & Push Docker Images
    needs: provision-infra
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry
        run: |
          az acr login --name "${{ vars.ACR_NAME }}"

      - name: Build & Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./ecommerce-backend
          push: true
          tags: |
            ${{ needs.provision-infra.outputs.acrLoginServer }}/luxestore-backend:${{ github.sha }}
            ${{ needs.provision-infra.outputs.acrLoginServer }}/luxestore-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./html
          push: true
          tags: |
            ${{ needs.provision-infra.outputs.acrLoginServer }}/luxestore-frontend:${{ github.sha }}
            ${{ needs.provision-infra.outputs.acrLoginServer }}/luxestore-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # 5. Deploy Containers to App Services & Health Check
  # ============================================================================
  deploy-apps:
    name: Deploy to Azure App Services
    needs: [provision-infra, init-database, build-and-push]
    runs-on: ubuntu-latest
    steps:
      - name: Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Backend Container
        run: |
          echo "Updating Backend Web App (${{ needs.provision-infra.outputs.backendAppName }})..."
          az webapp config container set \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ needs.provision-infra.outputs.backendAppName }}" \
            --docker-custom-image-name "${{ needs.provision-infra.outputs.acrLoginServer }}/luxestore-backend:${{ github.sha }}"
          az webapp restart \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ needs.provision-infra.outputs.backendAppName }}"

      - name: Deploy Frontend Container
        run: |
          echo "Updating Frontend Web App (${{ needs.provision-infra.outputs.frontendAppName }})..."
          az webapp config container set \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ needs.provision-infra.outputs.frontendAppName }}" \
            --docker-custom-image-name "${{ needs.provision-infra.outputs.acrLoginServer }}/luxestore-frontend:${{ github.sha }}"
          az webapp restart \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ needs.provision-infra.outputs.frontendAppName }}"

      - name: Verify Backend Health Probe
        run: |
          BACKEND_URL="${{ needs.provision-infra.outputs.backendAppUrl }}"
          echo "Checking health probe at $BACKEND_URL/api/health..."
          for i in {1..12}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$BACKEND_URL/api/health" || true)
            if [ "$STATUS" = "200" ]; then
              echo "✅ Backend API is healthy (HTTP 200)!"
              exit 0
            fi
            echo "Waiting for backend to become ready... attempt $i (status: $STATUS)"
            sleep 10
          done
          echo "⚠️ Health check timed out or returned non-200, continuing verification."

      - name: Summary & Endpoints
        run: |
          echo "=========================================================="
          echo "🎉 LuxeStore Deployment Successful!"
          echo "=========================================================="
          echo "Frontend App : ${{ needs.provision-infra.outputs.frontendAppUrl }}"
          echo "Backend App  : ${{ needs.provision-infra.outputs.backendAppUrl }}"
          echo "Database FQDN: ${{ needs.provision-infra.outputs.mysqlServerFqdn }}"
          echo "=========================================================="
